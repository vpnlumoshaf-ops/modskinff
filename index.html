<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống đang bảo trì</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .gear-icon {
            font-size: 80px;
            color: #38bdf8;
            animation: spin 3s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { font-size: 1.1rem; color: #94a3b8; }
        .admin-contact {
            margin-top: 30px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        span { color: #facc15; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="gear-icon"><i class="fas fa-cog"></i></div>
        <h1>HỆ THỐNG AIMLOCK PREMIUM</h1>
        <p>Hệ thống đang được nâng cấp lên <strong>v6</strong> để mang lại trải nghiệm tốt nhất.</p>
        
        <div class="admin-contact">
            Vui lòng liên hệ Admin <span>Tiến Phát</span> để biết thêm thông tin chi tiết.
        </div>
    </div>

</body>
</html>
