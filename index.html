<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    body {
        /* Đã đổi sang ảnh online chung thư mục để bao hiện hình nền 100% không bị chặn */
        background-image: url("dvbk.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        background-color: #121212; 
        color: #ffffff;
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    @keyframes rgb-border {
        0% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        33% { border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
        66% { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; }
        100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
    }

    .container {
        background: rgba(20, 20, 20, 0.85);
        padding: 30px 20px;
        border-radius: 20px;
        border: 2px solid #ffcc00;
        animation: rgb-border 3s linear infinite;
        width: 80%;
        text-align: center;
        backdrop-filter: blur(5px);
        position: relative;
    }

    h2 { color: #ffcc00; text-shadow: 2px 2px 4px #000; margin-top: 0; }
    
    input {
        width: 90%;
        padding: 12px;
        margin: 20px 0;
        border-radius: 10px;
        border: 1px solid #ffcc00;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        text-align: center;
        font-size: 16px;
        outline: none;
        animation: rgb-border 2s linear infinite;
    }

    button {
        background: linear-gradient(45deg, #ffcc00, #ff9900);
        color: #000;
        border: none;
        padding: 12px 0;
        width: 100%;
        border-radius: 10px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(255, 153, 0, 0.3);
        margin-top: 10px;
    }

    .loader {
        display: none;
        margin: 20px auto;
        border: 4px solid #333;
        border-top: 4px solid #ffcc00;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    #loadingText {
        display: none;
        color: #ffcc00;
        font-weight: bold;
        margin-top: 10px;
        letter-spacing: 1px;
    }
</style>

</head>
<body>
    <div class="container" id="mainBox">
        <div id="contentUI">
            <h2>XÁC NHẬN KEY</h2>
            <input type="text" id="keyInput" placeholder="Nhập Key ở đây">
            <button onclick="checkKey()">KÍCH HOẠT</button>
            <button onclick="getKey()">GET KEY</button>
        </div>

        <div class="loader" id="loaderIcon"></div>
        <div id="loadingText">ĐANG LOAD FILES...</div>
    </div>

    <script>
    var input = document.getElementById('keyInput');
    var baseText = "Nhập Key ở đây";
    var dots = 0;
    setInterval(function() {
        dots++;
        if (dots > 3) dots = 0;
        input.placeholder = baseText + ".".repeat(dots);
    }, 500);

    function checkKey() {
        var key = document.getElementById("keyInput").value;
        if (key === "MACARAMODZ") {
            document.getElementById("contentUI").style.display = "none";
            document.getElementById("loaderIcon").style.display = "block";
            document.getElementById("loadingText").style.display = "block";
            
            setTimeout(function(){
                if(window.AndroidBridge){
                    AndroidBridge.thongBaoThanhCong();
                } else {
                    location.reload();
                }
            }, 2000);
        } else {
            // ĐÃ BỎ LỆNH ALERT GÂY LỖI CRASH TOAST TRÊN SKETCHWARE
            if(window.AndroidBridge){
                AndroidBridge.thongBaoSaiKey();
            } else {
                input.value = "";
                input.placeholder = "SAI KEY RỒI VŨ ƠI!";
            }
        }
    }

    function getKey() {
        if(window.AndroidBridge){
            AndroidBridge.moLinkNgoai();
        } else {
            window.open("https://link4sub.com/notes/KjAx", "_blank");
        }
    }
</script>
</body>
</html>
